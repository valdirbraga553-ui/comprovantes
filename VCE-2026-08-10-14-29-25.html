<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprovante SVA Setor D2</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    
    body {
        background: #f5f5f5;
        padding: 20px;
    }

    .wrapper {
        display: flex;
        gap: 10px;
        max-width: 1200px;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* LADO ESQUERDO - COMPROVANTE */
    .comprovante {
        width: 40%;
        padding: 25px 20px;
        border-right: 2px dashed #ccc;
        position: relative;
    }

    .comprovante .label-vertical {
        position: absolute;
        left: -80px;
        top: 50%;
        transform: rotate(-90deg);
        font-size: 18px;
        font-weight: bold;
        white-space: nowrap;
    }

    .comprovante .igreja-vertical {
        position: absolute;
        left: -60px;
        top: 60%;
        transform: rotate(-90deg);
        font-size: 12px;
        white-space: nowrap;
    }

    .logo-iasd {
        width: 50px;
        height: 50px;
        background: #888;
        border-radius: 50%;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 10px;
    }

    .comprovante h3 { font-size: 16px; margin-bottom: 4px; }
    .comprovante p { font-size: 14px; margin-bottom: 15px; }
    
    .campo { margin-bottom: 12px; }
    .campo label { font-size: 14px; display: block; margin-bottom: 3px; }
    .linha { border-bottom: 1px solid #000; height: 22px; margin-left: 5px; }

    .row { display: flex; gap: 20px; margin-top: 15px; }
    .row .campo { flex: 1; }

    .assinatura { margin-top: 30px; border-top: 1px solid #000; padding-top: 5px; text-align: center; font-size: 12px; }

    /* LADO DIREITO - RECIBO */
    .recibo {
        width: 60%;
        padding: 25px 20px;
        background: repeating-linear-gradient(45deg, #fafafa, #fafafa 10px, #fff 10px, #fff 20px);
    }

    .recibo-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
    }
    .recibo-header h2 { font-size: 22px; text-align: center; flex: 1; }
    .recibo-header h3 { font-size: 18px; }

    .recibo-info p { font-size: 14px; margin-bottom: 4px; }
    .valor-box { text-align: right; }
    .valor-box .label { font-size: 14px; }
    .valor-box .valor { font-size: 18px; font-weight: bold; }

    .recibo-meio {
        display: flex;
        align-items: center;
        justify-content: space-around;
        margin: 20px 0;
    }
    .texto-app { text-align: center; }
    .texto-app h3 { font-size: 18px; line-height: 1.3; }
    .app-stores { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
    .app-btn { background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; }

    .celular { width: 60px; height: 110px; border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .celular span { font-style: italic; color: #2a4d9b; font-size: 20px; }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-bottom: 15px;
    }
    table th, table td {
        padding: 4px;
        text-align: right;
    }
    table th { text-align: center; font-weight: bold; }
    table th:first-child, table td:first-child { text-align: left; }
    table tr:last-child { border-top: 2px solid #000; font-weight: bold; }

    .rodape {
        display: flex;
        gap: 15px;
        align-items: center;
    }
    img { width: 80px; height: 80px; background: #000; }
    .auth { font-size: 11px; line-height: 1.4; }
    .codigo { font-family: monospace; font-weight: bold; margin-top: 5px; }

    @media (max-width: 900px) {
        .wrapper { flex-direction: column; }
        .comprovante, .recibo { width: 100%; }
    }
</style>
</head>
<body>


    <!-- LADO 2: RECIBO + HISTÓRICO -->
    <div class="recibo">
        <div class="recibo-header">
            <div class="recibo-info">
                <h2>Recibo</h2>
                <p><b>Manoel Oliveira</b></p>
                <p>Código: UTLex4QZ</p>
                <p>Última Doação</p>
                <p style="margin-top:8px;">Para o SVA</p>
                <p>R$ 150,00</p>
            </div>
            <div class="valor-box">
                <div class="label">Valor Total</div>
                <div class="valor">R$ 150,00</div>
            </div>
        </div>

   


        <h3 style="text-align:center; margin-bottom:8px;">Histórico</h3>
        <table>
            <tr>
                <th>Data</th><th>SVA</th><th>Outro</th><th>Total</th>
            </tr>
           <tr><td>08/2026</td><td>R$150,00</td><td>R$0,00</td><td>R$150,00</td>
          <tr><td>07/2026</td><td>R$100,00</td><td>R$0,00</td><td>R$100,00</td>
            <tr><td>Total</td><td>R$250,00</td><td>R$0,00</td><td>R$250,00</td></tr>
        </table>

        <div class="rodape">
            <img src="https://i.pinimg.com/736x/d5/23/64/d52364898cbdecb879db2c54719455f9.jpg">
           
         <div class="auth">
   
                <b>https://4br.me/</b> e digite o código abaixo:
                <div class="codigo">UTLex4QZ</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
